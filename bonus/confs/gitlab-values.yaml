
global:
  edition: ce
  hosts:
    domain: gitlab.local
  ingress:
    enabled: false
    configureCertmanager: false
  gatewayApi:
    enabled: false
    configureCertmanager: false
  smtp:
    enabled: false
  appConfig:
    applicationSettingsCacheSeconds: 60

installCertmanager: false

nginx-ingress:
  enabled: false

gitlab-runner:
  install: false

prometheus:
  install: false

grafana:
  enabled: false

registry:
  enabled: false

gitlab:
  webservice:
    minReplicas: 1
    maxReplicas: 1
    resources:
      requests:
        cpu: 300m
        memory: 1.5Gi
  sidekiq:
    minReplicas: 1
    maxReplicas: 1
  gitaly:
    persistence:
      size: 10Gi
  toolbox:
    enabled: true

minio:
  persistence:
    size: 10Gi
