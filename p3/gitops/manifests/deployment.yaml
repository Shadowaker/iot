apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-playground
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-playground
  template:
    metadata:
      labels:
        app: iot-playground
    spec:
      containers:
      - name: iot-playground
        image: shadowaker/iot-app:v1
        ports:
        - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: iot-playground
  namespace: dev
spec:
  type: NodePort
  selector:
    app: iot-playground
  ports:
  - port: 8888
    targetPort: 8888
    nodePort: 30888
